services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - resume_data:/data
    # Bind to your internal network address only — point your cloudflared
    # tunnel's ingress at http://100.107.227.53:9130. Nothing here is
    # exposed directly to the internet.
    ports:
      - "100.107.227.53:9130:8000"

volumes:
  resume_data:
